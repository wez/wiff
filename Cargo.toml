[workspace]
members = [
    "crates/wiff",
    "crates/wiff-cast",
    "crates/wiff-config",
    "crates/wiff-core",
    "crates/wiff-diff",
    "crates/wiff-forge",
    "crates/wiff-tui",
]
resolver = "3"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
too_many_arguments = "deny"

# Profile used to generate release binaries in CI.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
bitflags = "2"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
fancy-regex = "0.19"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
nix = { version = "0.30", features = ["fs", "poll", "signal"] }
nucleo-matcher = "0.3"
octocrab = "0.54"
percent-encoding = "2"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_plain = "1"
similar = "3"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile = "3"
termwiz = { version = "0.23", default-features = false }
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-textarea = "0.7"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ulid = { version = "3", features = ["serde"] }
url = "2"
wiff-config = { path = "crates/wiff-config" }
wiff-core = { path = "crates/wiff-core" }
wiff-diff = { path = "crates/wiff-diff" }
wiff-forge = { path = "crates/wiff-forge" }
wiff-tui = { path = "crates/wiff-tui" }
wince = "0.2.0"
wiremock = "0.6"
