name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: make build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: taiki-e/install-action@nextest
      - name: Install jj
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.44.0 --repo jj-vcs/jj \
            --pattern 'jj-v0.44.0-x86_64-unknown-linux-musl.tar.gz' \
            --output /tmp/jj.tar.gz
          tar xz -C ~/.cargo/bin -f /tmp/jj.tar.gz
      - uses: Swatinem/rust-cache@v2
      - run: make test

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  create-release:
    # Publish only after the full check suite is green, and only from the
    # canonical repository on a push to main or a manual run.
    needs: [build, lint, test, fmt]
    if: >-
      github.repository == 'wez/wiff'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A newer push cancels an in-progress older one so they cannot both move the
    # rolling `continuous` tag. The per-target `binaries` group below extends
    # this to the uploads.
    concurrency:
      group: continuous
      cancel-in-progress: true
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GH_REPO/git/refs/tags/continuous" -X PATCH \
            -f sha="$GITHUB_SHA" -F force=true \
            || gh api "repos/$GH_REPO/git/refs" -X POST \
              -f ref=refs/tags/continuous -f sha="$GITHUB_SHA"
          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous --target "$GITHUB_SHA" \
              --notes "Built from main at $GITHUB_SHA."
          else
            gh release create continuous --prerelease --target "$GITHUB_SHA" \
              --title continuous --notes "Built from main at $GITHUB_SHA."
          fi

  binaries:
    needs: create-release
    permissions:
      # contents: write to upload assets; id-token/attestations for the
      # keyless build provenance attestation below.
      contents: write
      id-token: write
      attestations: write
    # Serialize uploads per target so an older run cannot overwrite a newer
    # run's archive: without this, two pushes in quick succession would each
    # clobber the same `continuous` asset and the release could end up holding
    # archives built from two different commits.
    concurrency:
      group: continuous-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - id: upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: wiff
          package: wiff
          target: ${{ matrix.target }}
          profile: dist
          locked: true
          include: LICENSE,README.md
          checksum: sha256
          tar: unix
          ref: refs/tags/continuous
          token: ${{ secrets.GITHUB_TOKEN }}
      # Keyless Sigstore provenance for the uploaded archive, bound to this
      # workflow's OIDC identity. Verify a download with:
      #   gh attestation verify wiff-<target>.tar.gz --repo wez/wiff
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.upload.outputs.tar }}

  # Publish the installer only once every archive it points at exists, so the
  # script served from the release is never newer than the binaries it fetches.
  publish-installer:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: continuous-installer
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload continuous install.sh --clobber
